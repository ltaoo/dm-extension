assert([...document.querySelectorAll('[n="cookies-row"]')].some((row) => row.textContent.includes("stress-1999")), "翻页应能访问最后一项 Cookie");
assert(cookie$.state.rows.value.at(-1).index === 1999, "分页后选择行仍应使用完整列表索引");
const last_checkbox = document.querySelector('[aria-label="选择 Cookie stress-1999"]');
last_checkbox.click();
assert(cookie$.state.selected_count.value === 0, "末页复选框应切换完整列表中对应的 Cookie");
last_checkbox.click();
assert(cookie$.state.selected_count.value === 1, "再次勾选末页 Cookie 应恢复选择");
node("menu-cookie-sync").click();
assert(cookie$.state.leaving_page.value === "cookie" && cookie$.state.rows.value.length === 50, "Cookie 退场动画期间应保留原表格数据");
for (let attempts = 0; cookie$.state.leaving_page.value === "cookie" && attempts < 120; attempts += 1) {
  assert(!document.querySelector("#cookie-page").textContent.includes("当前页面没有可用的 Cookie"), "Cookie 切到同步页时不能闪现空状态卡片");
  await tick();
}
assert(document.querySelector("#cookie-page").hidden && document.querySelectorAll('[n="cookies-row"]').length === 0, "退场结束后应隐藏 Cookie 页并清空渲染行");
node("menu-cookie").click();
await tick();
assert(cookie$.state.selected_count.value === 1, "切换页面应保留 Cookie 选择");

window.confirm = native_confirm;
document.body.setAttribute("data-test-passed", "");
</script></body></html>
