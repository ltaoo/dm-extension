<!doctype html><html data-n="test-document"><head data-n="test-head"><meta charset="utf-8">
<link rel="stylesheet" href="../assets/vendor/src/dmui.css" data-n="component-style" />
<link rel="stylesheet" href="../src/popup/popup.css" data-n="popup-style" />
</head><body data-n="test-body">
<div id="root" data-n="popup-root"></div>
<script data-n="test-stub">
  // popup.js / store.js 顶层取全局 chrome（getManifest 在模块加载时执行），必须先桩好。
  const writes = {};
  globalThis.__storage_writes = writes;
  const removed = [];
  globalThis.__storage_removed = removed;
  globalThis.__confirm_messages = [];
  globalThis.confirm = (message) => { globalThis.__confirm_messages.push(message); return true; };
  globalThis.__closed = false;
  window.close = () => { globalThis.__closed = true; };
  // 捕获注入调用：剪藏靠 executeScript 把 clip_region 送进页面。
  const exec_calls = [];
  globalThis.__exec_calls = exec_calls;
  const created = [];
  globalThis.__tabs_created = created;
  const records = [
    { id: "c1", url: "https://example.com/a", title: "商品卡片", node: "div#card", hostname: "example.com",
      html: '<div style="all:initial!important">卡</div>', width: 320, height: 128, element_count: 12,
      image_count: 3, image_missing: 1, byte_size: 4096, options: { important: true, inline_images: true, materialize_pseudo: true }, created_at: 200 },
    { id: "c2", url: "https://other.test/b", title: "价格表", node: "table", hostname: "other.test",
      html: '<table style="all:initial!important"><tr><td>价</td></tr></table>', width: 0, height: 0, element_count: 5,
      image_count: 0, image_missing: 0, byte_size: 512, options: { important: true, inline_images: true, materialize_pseudo: true }, created_at: 100 },
    { id: "", url: "https://broken.test/", title: "缺 id", html: "<p>丢弃</p>", created_at: 300 },
  ];
  globalThis.chrome = {
    runtime: {
      getManifest: () => ({ version_name: "v260830", version: "26.8.30" }),
      getURL: (path) => `chrome-extension://test/${path}`,
      sendMessage: async () => ({ success: true, profiles: [{
        id: "default", name: "默认", enabled: false, endpoint: "http://127.0.0.1:2022/api/cookies/update", intervalMinutes: 60,
        encryption: { method: "none", uuid: "", password: "" }, domainFilter: { domains: [] },
      }], statuses: {} }),
    },
    storage: {
      local: {
        get: async (keys) => {
          const data = {
            "popup-page": "clip",
            "page-parsers": [],
            "detection-rules": [],
            "region-clips": records,
            "clip-options": { important: true, inline_images: false, materialize_pseudo: true },
          };
          const wanted = Array.isArray(keys) ? keys : [keys];
          return Object.fromEntries(wanted.filter(Boolean).map((key) => [key, data[key]]));
        },
        set: async (items) => { Object.assign(writes, items); },
        remove: async (key) => { removed.push(key); writes[key] = undefined; },
      },
      onChanged: { addListener() {}, removeListener() {} },
    },
    tabs: {
      query: async () => [{ id: 1, url: "https://example.com/", title: "示例" }],
      create: async (options) => { created.push(options); return {}; },
    },
    cookies: { getAllCookieStores: async () => [{ id: "0", tabIds: [1] }], getAll: async () => [] },
    scripting: {
      executeScript: async ({ func, args }) => {
        // refresh_page 走同一个 API 抓页面 HTML，只有剪藏的选择器需要记账。
        if (func?.name === "clip_region") { exec_calls.push({ func, args }); return [{ result: { ok: true } }]; }
        return [{ result: { title: "示例页面", url: "https://example.com/", parser: "generic", html: "<html><body><p>内容</p></body></html>", images: [], videos: [], files: [] } }];
      },
    },
  };
</script>
<script type="module" data-n="test-script">
window.addEventListener("error", (event) => document.body.setAttribute("data-test-error", event.message));
window.addEventListener("unhandledrejection", (event) => document.body.setAttribute("data-test-error", String((event.reason && event.reason.message) || event.reason)));
await import("../src/popup/popup.js");

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const row_of = (title) => Array.from(document.querySelectorAll(".clip-record-row"))
  .find((row) => row.querySelector(".clip-record-open").textContent.trim() === title);

// —— 菜单与标题 ——
const menu_labels = Array.from(document.querySelectorAll(".popup-menu-button")).map((button) => button.textContent.trim());
if (!menu_labels.includes("剪藏")) throw new Error(`菜单应含「剪藏」，实际 ${menu_labels.join("、")}`);
if (!document.querySelector('[n="menu-clip"]')) throw new Error("菜单应有剪藏按钮");
const heading = document.querySelector(".popup-title");
if (!heading || heading.textContent.trim() !== "剪藏") throw new Error(`标题应为「剪藏」：${heading && heading.textContent}`);
const clip_page = document.querySelector("#clip-page");
if (!clip_page || clip_page.hasAttribute("hidden")) throw new Error("剪藏页应可见");

// —— 记录列表：坏数据丢弃、按时间倒序、统计文案 ——
const rows = Array.from(document.querySelectorAll(".clip-record-row"));
if (rows.length !== 2) throw new Error(`应渲染 2 条剪藏记录（缺 id 的丢弃），实际 ${rows.length}（${rows.map((row) => row.textContent.trim()).join(" | ")}）`);
if (rows[0].querySelector(".clip-record-open").textContent.trim() !== "商品卡片") throw new Error("新的记录应排在最前");
const stats = (row) => row.querySelector(".clip-record-stats").textContent.trim();
if (stats(rows[0]) !== "12 个元素 · 320×128 · 图片 3（缺失 1） · 4.0 KB") throw new Error(`统计文案错误：${stats(rows[0])}`);
if (stats(rows[1]) !== "5 个元素 · 512 B") throw new Error(`统计文案错误：${stats(rows[1])}`);
if (rows[0].querySelector(".clip-record-source").textContent.trim() !== "来源 example.com") throw new Error("应显示来源 hostname");
if (clip_page.querySelector(".clip-count").textContent.trim() !== "共 2 条") throw new Error("计数应为 2");
if (!clip_page.querySelector(".clip-records-empty").hasAttribute("hidden")) throw new Error("有记录时不应显示空状态");

// —— 选项：按存储的 clip-options 回填（inline_images 为 false）——
if (!clip_page.querySelector('[n="clip-important-input"]')) throw new Error("应有 !important 选项");
if (!clip_page.querySelector('[n="clip-inline-images-input"]')) throw new Error("应有内联图片选项");
if (!clip_page.querySelector('[n="clip-pseudo-input"]')) throw new Error("应有伪元素选项");

// —— 打开结果页：新标签页指向 src/clip/clip.html?id=… ——
rows[1].querySelector('[n="clip-record-open"]').click();
await wait(100);
const opened = globalThis.__tabs_created.at(-1);
if (!opened || opened.url !== "chrome-extension://test/src/clip/clip.html?id=c2") throw new Error(`应在结果页打开该记录：${opened && opened.url}`);

// —— 删除：确认后写回 storage（只删这一条）——
rows[0].querySelector('[n="clip-record-remove"]').click();
await wait(200);
if (!globalThis.__confirm_messages.some((message) => message.includes("商品卡片"))) throw new Error("删除剪藏应先确认");
const kept = globalThis.__storage_writes["region-clips"];
if (!Array.isArray(kept) || kept.length !== 1 || kept[0].id !== "c2") throw new Error(`删除后应只剩 c2：${JSON.stringify(kept)}`);
if (document.querySelectorAll(".clip-record-row").length !== 1) throw new Error("删除后列表应少一行");
if (clip_page.querySelector(".clip-count").textContent.trim() !== "共 1 条") throw new Error("计数应随删除更新");

// —— 清空：确认后移除存储键，列表归空 ——
clip_page.querySelector('[n="clear-clips-button"]').click();
await wait(200);
if (!globalThis.__confirm_messages.some((message) => message.includes("清空全部"))) throw new Error("清空剪藏应先确认");
if (!globalThis.__storage_removed.includes("region-clips")) throw new Error("清空应移除 region-clips 键");
if (document.querySelectorAll(".clip-record-row").length !== 0) throw new Error("清空后不应有记录行");
if (clip_page.querySelector(".clip-records-empty").hasAttribute("hidden")) throw new Error("清空后应显示空状态");
if (clip_page.querySelector(".clip-count").textContent.trim() !== "共 0 条") throw new Error("清空后计数应为 0");

// —— 框选剪藏：注入自包含的选择器 + 当时的选项，写回选项，然后关掉弹窗 ——
const start = clip_page.querySelector('[n="start-clip-button"]');
if (start.disabled) throw new Error("HTTP(S) 页面上「框选剪藏」应可用");
start.click();
await wait(200);
if (globalThis.__exec_calls.length !== 1) throw new Error(`点击应注入一次选择器，实际 ${globalThis.__exec_calls.length}`);
const call = globalThis.__exec_calls[0];
if (typeof call.func !== "function") throw new Error("注入的 func 应为函数（供 scripting.executeScript 序列化）");
if (call.func.name !== "clip_region") throw new Error(`注入的函数应为区域选择器：${call.func.name}`);
if (JSON.stringify(call.args[0]) !== JSON.stringify({ important: true, inline_images: false, materialize_pseudo: true })) throw new Error(`注入的选项应来自存储：${JSON.stringify(call.args[0])}`);
if (JSON.stringify(globalThis.__storage_writes["clip-options"]) !== JSON.stringify({ important: true, inline_images: false, materialize_pseudo: true })) throw new Error("启动时应把归一化后的选项写回存储");
if (!globalThis.__closed) throw new Error("注入选择器后应关闭弹窗，让用户能操作页面");
const feedback = clip_page.querySelector('[n="clip-feedback"]');
if (!feedback.hasAttribute("hidden")) throw new Error(`启动成功不应有错误反馈：${feedback.textContent}`);

document.body.setAttribute("data-test-passed", "");
</script></body></html>
